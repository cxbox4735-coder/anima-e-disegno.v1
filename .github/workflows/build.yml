name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            docker/buildozer
            docker/gradle
          key: buildozer-cache-${{ runner.os }}-${{ hashFiles('Dockerfile', 'game/buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      # PULIZIA CACHE: rimuove Python 3.14 o build corrotti da cache vecchia
      - name: Clean stale builds
        run: |
          rm -rf docker/buildozer/android/platform/build-*/build/other_builds/python3
          rm -rf docker/buildozer/android/platform/build-*/build/other_builds/hostpython3
          rm -rf docker/buildozer/android/platform/build-*/dists
          mkdir -p docker/buildozer docker/gradle

      - name: Build Docker image
        run: docker build -t kivy/buildozer .

      - name: Set permissions
        run: |
          chmod -R 777 docker/buildozer docker/gradle
          chmod -R 777 game

      # Build unico: Python 3.11.9 + Cython 0.29.37 + pygame-ce
      - name: Build APK
        run: |
          docker run --rm \
            --user root \
            -v "$(pwd)/docker/buildozer":/root/.buildozer \
            -v "$(pwd)/docker/gradle":/root/.gradle \
            -v "$(pwd)/game":/root/hostcwd \
            kivy/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Disegna-e-Anima-Pro-APK
          path: game/bin/*.apk
          if-no-files-found: error
