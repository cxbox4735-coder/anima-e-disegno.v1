name: Build APK with Buildozer

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libpng-dev libjpeg-dev zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <licenses>
            <license id="android-sdk-license" type="user">
              <accepted-by>build</accepted-by>
              <accepted-on>1640000000000</accepted-on>
            </license>
            <license id="android-sdk-preview-license" type="user">
              <accepted-by>build</accepted-by>
              <accepted-on>1640000000000</accepted-on>
            </license>
            <license id="intel-android-extra-license" type="user">
              <accepted-by>build</accepted-by>
              <accepted-on>1640000000000</accepted-on>
            </license>
            <license id="mips-android-system-image-license" type="user">
              <accepted-by>build</accepted-by>
              <accepted-on>1640000000000</accepted-on>
            </license>
          </licenses>' > ~/.android/licenses.xml
        shell: bash

      - name: Build APK Debug
        run: |
          buildozer -v android debug
        timeout-minutes: 120

      - name: Upload APK on success
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: bin/*.apk

      - name: Show error logs if failed
        if: failure()
        run: |
          echo "=== Last buildozer output ===" 
          cat .buildozer/android/platform/build/build.log 2>/dev/null | tail -50 || echo "No log found"
