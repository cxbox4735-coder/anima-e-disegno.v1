name: Build APK with Buildozer

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libpng-dev libjpeg-dev zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK Debug
        run: |
          buildozer -v android debug
        timeout-minutes: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: bin/*.apk

      - name: Show build errors if failed
        if: failure()
        run: |
          echo "=== Last 100 lines of buildozer.log ==="
          tail -100 .buildozer/android/platform/build/dist/*/build/outputs/*.log || true
          echo "=== Build directory listing ==="
          ls -la .buildozer/android/platform/build/dist/ 2>/dev/null || echo "Build dir not found"
