name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            docker/buildozer
            docker/gradle
          key: buildozer-cache-v5-${{ runner.os }}-${{ hashFiles('Dockerfile', 'game/buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      - name: Clean stale builds
        run: |
          rm -rf docker/buildozer/android/platform/build-*/build/other_builds/python3
          rm -rf docker/buildozer/android/platform/build-*/build/other_builds/hostpython3
          rm -rf docker/buildozer/android/platform/build-*/dists
          mkdir -p docker/buildozer docker/gradle

      - name: Build Docker image
        run: docker build -t kivy/buildozer .

      - name: Set permissions
        run: |
          chmod -R 777 docker/buildozer docker/gradle
          chmod -R 777 game

      - name: Build APK
        run: |
          docker run --rm \
            --user root \
            -v "$(pwd)/docker/buildozer":/root/.buildozer \
            -v "$(pwd)/docker/gradle":/root/.gradle \
            -v "$(pwd)/game":/root/hostcwd \
            kivy/buildozer -v android debug 2>&1 | tee buildozer.log
          
          # ✅ IMPORTANTE: controlla se Buildozer è fallito
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║                  BUILD FAILED (exit $exit_code)              ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "  Last 150 lines of buildozer.log:"
            tail -n 150 buildozer.log
            echo "╚══════════════════════════════════════════════════════════════╝"
            exit $exit_code
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-failure-log
          path: buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Disegna-e-Anima-Pro-APK
          path: game/bin/*.apk
          if-no-files-found: error
