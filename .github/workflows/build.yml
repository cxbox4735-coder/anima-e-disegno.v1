name: Build APK with Buildozer

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libpng-dev libjpeg-dev zlib1g-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Accept SDK licenses
        run: |
          mkdir -p ~/.android
          echo "y" > /tmp/licenses.txt
          while read line; do echo "y"; done < /dev/zero | \
            $JAVA_HOME/bin/keytool -genkey -v -keystore ~/.android/debug.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey \
            -keypass android -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Build APK Debug
        run: |
          buildozer -v android debug
        timeout-minutes: 120
        env:
          ANDROID_SDK_LICENSE: "y"
          ANDROID_NDK_LICENSE: "y"

      - name: Upload APK on success
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: bin/*.apk
