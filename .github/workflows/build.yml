name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            docker/buildozer
            docker/gradle
          key: buildozer-cache-${{ runner.os }}-${{ hashFiles('game/buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      - name: Build Docker image
        run: docker build -t kivy/buildozer .

      - name: Build APK
        run: |
          mkdir -p docker/buildozer docker/gradle
          chmod -R 777 docker/buildozer docker/gradle
          # FIX: dai i permessi di scrittura alla cartella game
          chmod -R 777 game
          docker run --rm \
            --user root \
            -v "$(pwd)/docker/buildozer":/root/.buildozer \
            -v "$(pwd)/docker/gradle":/root/.gradle \
            -v "$(pwd)/game":/root/hostcwd \
            kivy/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Disegna-e-Anima-Pro-APK
          path: game/bin/*.apk
          if-no-files-found: error
