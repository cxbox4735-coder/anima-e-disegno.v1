name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            docker/buildozer
            docker/gradle
          # La chiave include l'hash del Dockerfile e buildozer.spec:
          # quando li modifichi, la cache viene automaticamente invalidata
          key: buildozer-cache-${{ runner.os }}-${{ hashFiles('Dockerfile', 'game/buildozer.spec') }}
          restore-keys: |
            buildozer-cache-${{ runner.os }}-

      # Se la cache è vecchia, forza la ricostruzione di hostpython3
      - name: Clean stale hostpython3
        run: |
          # Force remove any cached python-for-android platforms, dists and related SDK/NDK
          # to guarantee hostpython3 will be rebuilt with the pinned python version
          rm -rf docker/buildozer/android/platform || true
          rm -rf docker/buildozer/android/platform_* || true
          rm -rf docker/buildozer/apache-ant-* || true
          rm -rf docker/buildozer/android/sdk || true
          rm -rf docker/buildozer/android/ndk-* || true
          rm -rf docker/buildozer/android/ndk || true
          # Also remove any previously-built dists to avoid mixing hostpython versions
          rm -rf docker/buildozer/android/platform/build-* || true
          rm -rf docker/buildozer/android/platform/dists || true
          rm -rf docker/buildozer/android/platform/build || true
          # Ensure directories exist for mounts
          mkdir -p docker/buildozer docker/gradle

      - name: Build Docker image
        run: docker build -t kivy/buildozer .

      - name: Set permissions
        run: |
          chmod -R 777 docker/buildozer docker/gradle
          chmod -R 777 game

      # Prima passata: scarica SDK/NDK e costruisce hostpython3.
      # Fallirà su pygame-ce (manca Cython), ma hostpython3 verrà creato.
      - name: Bootstrap Buildozer (create hostpython3)
        run: |
          docker run --rm \
            --user root \
            -v "$(pwd)/docker/buildozer":/root/.buildozer \
            -v "$(pwd)/docker/gradle":/root/.gradle \
            -v "$(pwd)/game":/root/hostcwd \
            kivy/buildozer -v android debug || true

      # Installa Cython dentro l'hostpython3 appena creato
      - name: Install Cython in hostpython3
        run: |
          HPY=$(find docker/buildozer/android/platform/build-*/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python -print -quit 2>/dev/null || true)
          if [ -n "$HPY" ]; then
            echo "Found hostpython3 at: $HPY"
            docker run --rm \
              --user root \
              -v "$(pwd)/docker/buildozer":/root/.buildozer \
              -v "$(pwd)/game":/root/hostcwd \
              kivy/buildozer \
              bash -c "$HPY -m ensurepip && $HPY -m pip install 'Cython<0.30'"
          else
            echo "WARNING: hostpython3 not found, build will likely fail"
          fi

      # Build vera e propria: ora hostpython3 ha Cython e pygame-ce compila
      - name: Build APK
        run: |
          docker run --rm \
            --user root \
            -v "$(pwd)/docker/buildozer":/root/.buildozer \
            -v "$(pwd)/docker/gradle":/root/.gradle \
            -v "$(pwd)/game":/root/hostcwd \
            kivy/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Disegna-e-Anima-Pro-APK
          path: game/bin/*.apk
          if-no-files-found: error
