      - name: Build APK with Buildozer (if buildozer.spec exists)
        run: |
          if [ -f buildozer.spec ]; then
            echo "Found buildozer.spec — starting build inside Docker container"
            docker run --rm --entrypoint /bin/bash \
              -v "${{ github.workspace }}":/home/user/hostcwd \
              -w /home/user/hostcwd \
              kivy/buildozer:latest \
              -lc "yes | buildozer -v android debug"
          else
            echo "No buildozer.spec found in repo root — skipping APK build"
          fi
