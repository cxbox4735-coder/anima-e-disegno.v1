name: CI - Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies (without docker.io)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-pip python3-venv git zip unzip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libpng-dev libjpeg-dev zlib1g-dev

      - name: Install Python requirements (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping pip install"
          fi

      - name: Check Docker available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker CLI not found on runner — cannot run Buildozer docker image."
            echo "On hosted runners docker should be available; if not, consider using a self-hosted runner or remove Docker steps."
            exit 1
          fi
          docker --version

      - name: Build APK with Buildozer (if buildozer.spec exists)
        run: |
          if [ -f buildozer.spec ]; then
            echo "Found buildozer.spec — starting build inside Docker container"
            docker run --rm \
              -v "${{ github.workspace }}":/home/user/hostcwd \
              -w /home/user/hostcwd \
              kivy/buildozer:latest \
              /bin/bash -lc "buildozer -v android debug"
          else
            echo "No buildozer.spec found in repo root — skipping APK build"
          fi

      - name: Upload APK artifact (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            bin/*.apk
            bin/*.aab

      - name: Save build logs
        if: failure()
        run: |
          echo "Build failed. Collecting logs..."
          ls -la || true
          if [ -d .buildozer ]; then
            tar -czf buildozer-logs.tar.gz .buildozer || true
            ls -la buildozer-logs.tar.gz || true
          fi
