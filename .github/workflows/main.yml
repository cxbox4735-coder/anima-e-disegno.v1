name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libffi-dev libssl-dev \
          python3-dev libltdl-dev openjdk-17-jdk zip unzip \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev

    - name: Cache Buildozer & Android SDK/NDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools "cython<3.0"
        pip install git+https://github.com/kivy/buildozer.git

    - name: Generate buildozer.spec if missing
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Se non hai committato buildozer.spec, applica le modifiche minime di fallback
        if ! grep -q "package.name = animadisegno" buildozer.spec 2>/dev/null; then
          sed -i 's/^title = .*/title = AnimaEDisegno/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = animadisegno/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.cxbox/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,pygame,Pillow/' buildozer.spec
          sed -i 's/^# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^# android.api = .*/android.api = 33/' buildozer.spec
          sed -i 's/^# android.minapi = .*/android.minapi = 21/' buildozer.spec
          sed -i 's/^# android.ndk = .*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^# android.sdk = .*/android.sdk = 33/' buildozer.spec
          sed -i 's/^# android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/^# android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/^# orientation = .*/orientation = landscape/' buildozer.spec
          sed -i 's/^# fullscreen = .*/fullscreen = 1/' buildozer.spec
        fi

    - name: Build APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        buildozer -v android debug
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    - name: Verify APK output
      run: |
        echo "=== APK trovati ==="
        find . -name "*.apk" -type f
        ls -la bin/ 2>/dev/null || echo "Cartella bin vuota o mancante"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
        if-no-files-found: error
