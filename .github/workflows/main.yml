name: CI - Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache buildozer outputs
        uses: actions/cache@v4
        with:
          path: ./.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies (without docker.io)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-pip python3-venv git zip unzip \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libpng-dev libjpeg-dev zlib1g-dev

      - name: Install Python requirements (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Add 4G swap (temporary)
        run: |
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Check Docker available
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker CLI not found on runner — cannot run Buildozer docker image."
            exit 1
          fi
          docker --version

      - name: Build APK with Buildozer (with retries)
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "No buildozer.spec found — skipping"
            exit 0
          fi

          attempts=0
          max_attempts=3
          exit_code=1
          until [ $attempts -ge $max_attempts ]
          do
            attempts=$((attempts+1))
            echo "Build attempt $attempts/$max_attempts ..."
            docker run --rm --entrypoint /bin/bash \
              -v "${{ github.workspace }}":/home/user/hostcwd \
              -w /home/user/hostcwd \
              kivy/buildozer:latest \
              -lc "yes | buildozer -v android debug"
            exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "Build succeeded on attempt $attempts"
              break
            fi
            echo "Build failed with exit code $exit_code. Retrying in $((2**attempts))s..."
            sleep $((2**attempts))
          done

          if [ $exit_code -ne 0 ]; then
            echo "All attempts failed. Exiting with $exit_code"
            exit $exit_code
          fi
        timeout-minutes: 180

      - name: Diagnose workspace (list and compress logs)
        if: always()
        run: |
          echo "=== find apk files ==="
          find . -type f -iname "*.apk" -print || true
          echo "=== list top-level bin ==="
          ls -la bin || true
          echo "=== list .buildozer (head) ==="
          ls -la .buildozer || true
          if [ -d .buildozer ]; then
            tar -czf buildozer-logs.tar.gz .buildozer || true
            du -sh .buildozer || true
          fi

      - name: Extract p4a/build errors
        if: always()
        shell: bash
        run: |
          echo "Searching .buildozer for common error patterns (HTTP Error, Download failed, Killed, undefined reference, error:)"
          if [ ! -d .buildozer ]; then
            echo ".buildozer directory not found"
            exit 0
          fi

          # find occurrences and print with context
          grep -R -n -E "HTTP Error|Download failed|Killed|undefined reference|error:" .buildozer || true

          # For each match, print file and 5 lines of context so it's easy to read in Actions UI
          grep -R -n -E "HTTP Error|Download failed|Killed|undefined reference|error:" .buildozer | while IFS= read -r line; do
            file="${line%%:*}"
            lineno="${line#*:}"
            echo "----- $file : $lineno -----"
            start=$((lineno>5 ? lineno-5 : 1))
            sed -n "${start},$((lineno+5))p" "$file" || true
          done

      - name: Remove swap
        if: always()
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true

      - name: Upload APK artifact (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            **/*.apk
            **/*.aab

      - name: Upload buildozer logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            buildozer-logs.tar.gz
            .buildozer/**/*
